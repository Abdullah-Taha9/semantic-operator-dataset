[shared]
manifest = "queries_products.jsonl"
dataset = "datasets/products_filtered_with_embeddings.parquet"

[label]
backend = "vllm"
model = "Qwen/Qwen3.8-27B"
system_prompt = """
The user will provide a claim and some relevant context.
Your job is to determine whether the claim is true for the given context.
Provide your final answer using exactly one of these formats:
<answer>True</answer>
<answer>False</answer>
"""
queries = []
concurrency = 16                 # API backend only; vLLM schedules its own batch.
api_checkpoint_every = 500      # Responses per atomic API fragment.
vllm_checkpoint_every = 15    # Prompts per vLLM chat call and atomic fragment.
attempts = 1
retry_delay_seconds = 1.0
enable_cache = true
finalize_deferred_as_null = false # Rows with error 'length' from vllm are not proceed, True would set those to null
canary_rows = 1000
canary_max_deferred_fraction = 0.20

# No API generation parameter is set unless it is uncommented here.
[label.api_parameters]
# max_tokens = 10
# temperature = 0.0
# top_p = 1.0
# seed = 42

# These arguments are passed directly to vllm.SamplingParams. Omitted arguments
# use vLLM defaults, except max_tokens: omission deliberately means no output-only
[label.vllm_parameters]
# temperature = 1.0
# top_p = 0.95
# top_k = 20
# min_p = 0.0
# presence_penalty = 0.0
# repetition_penalty = 1.0
# seed = 42

# Arguments in this table are passed to vllm.LLM when the engine is created.
# Set this manually to the fewest GPUs needed to fit the model.
[label.vllm_engine_parameters]
tensor_parallel_size = 2
gpu_memory_utilization = 0.95
max_model_len = 40000
max_num_seqs = 15

[publish]
title = "Semantic Filter Labels for SemCEB Products"
repo_id = "Abdullah-Taha/products-filtered-labels"
citation_author = "Taha, Abdullah"
citation_year = 2026
card_template = "card_template.md"
queries = []
# repo_id = "your-org/semceb-products-filter-labels"

